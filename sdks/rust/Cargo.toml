[package]
name = "etunnel"
version = "1.3.1"
edition = "2021"
description = "Expose local services to the internet in one line of code: instant public HTTPS URLs with automatic TLS, through NAT and firewalls, no signup. Webhook-friendly ngrok-style reverse tunnel, with SDKs in 20 languages and a single-binary Go server."
license = "MIT"
readme = "README.md"
repository = "https://github.com/topcheer/etunnel"
homepage = "https://github.com/topcheer/etunnel"
keywords = ["tunnel", "reverse-proxy", "webhook", "localhost", "ngrok"]
categories = ["network-programming", "web-programming"]

[[bin]]
name = "etunnel"
path = "src/main.rs"

[dependencies]
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2", features = ["tls"] }
