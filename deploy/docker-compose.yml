# etunneld 3-instance mesh on Docker Desktop.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Then expose a tunnel on any node (they gossip): the SDK CLI with
# ETUNNEL_SERVER=ws://localhost:20301/tunnel (or .20302/.20303).
# Postgres + Redis are the shared stores; the mesh coordinates ownership.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: etunnel
      POSTGRES_PASSWORD: etunnel-dev
      POSTGRES_DB: etunnel
    ports: ["20390:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etunnel"]
      interval: 2s
      retries: 15
    tmpfs: /var/lib/postgresql/data  # dev-only: no durable volume needed

  redis:
    image: redis:7-alpine
    ports: ["20391:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15
    tmpfs: /data

  etunneld1: &node
    build: { context: .., dockerfile: Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: &nodeenv
      ETUNNEL_CLUSTER: mesh
      ETUNNEL_ADVERTISE: etunneld1:8080
      ETUNNEL_JOIN: ""
      ETUNNEL_PG_DSN: postgres://etunnel:etunnel-dev@postgres:5432/etunnel?sslmode=disable
      ETUNNEL_REDIS_URL: redis://redis:6379/2
      SESSION_SECRET: compose-dev-secret-0123456789abcdef
    command:
      - -domain=t.cluster.local
      - -addr=:8080
      - -http-addr=:8081
      - -admin-addr=:9090
      - -tls-mode=http
    ports: ["20301:8080", "20381:9090"]

  etunneld2:
    <<: *node
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      etunneld1: { condition: service_started }
    environment:
      <<: *nodeenv
      ETUNNEL_ADVERTISE: etunneld2:8080
      ETUNNEL_JOIN: etunneld1:8180
    ports: ["20302:8080", "20382:9090"]

  etunneld3:
    <<: *node
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      etunneld1: { condition: service_started }
    environment:
      <<: *nodeenv
      ETUNNEL_ADVERTISE: etunneld3:8080
      ETUNNEL_JOIN: etunneld1:8180
    ports: ["20303:8080", "20383:9090"]
