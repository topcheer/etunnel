# Release hygiene: NEVER move or force-push an existing v* tag. Every
# publish job is check-then-run (queries the registry for the version
# before pushing), so re-running a tag's workflow is a no-op; but moving
# a tag breaks that guarantee (new SHA, same version) and sends re-tag
# warning emails to watchers. If a release is wrong, ship vNEXT.
name: sdk-packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Live PG/Redis for the cluster store tests (skip when unreachable).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: etunnel
          POSTGRES_PASSWORD: etunnel-ci
          POSTGRES_DB: etunnel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U etunnel"
          --health-interval 3s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 5s --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04: the 22.04 runner pool spent 2026-11-11 unable to
        # reach its apt/keyserver mirrors (three release runs died there);
        # noble also matches the Swift 6 tarball below. macOS pool note:
        # artifacts are source-identical, ubuntu-only by choice.
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      # ---- language setup actions (both OS) ----
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # NOTE: deno is intentionally NOT installed - pack-deno only tars
      # sources (no deno invocation), and setup-deno was the sole recurring
      # 504 source (deno CDN flakes).
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # setup-swift@v2 refreshes GPG keys from keyserver.ubuntu.com, which is
      # unreachable from GH runners often enough to kill every release
      # (v1.5.0 and v1.6.0 both died here). Install the official tarball
      # directly instead - no signature/keyserver round-trip.
      - name: Ensure Swift (noble ships it; tarball fallback)
        if: runner.os == 'Linux'
        run: |
          if command -v swift >/dev/null && swift --version 2>/dev/null | head -1; then
            echo "using the runner image's preinstalled Swift"
          else
            curl -fsSL https://download.swift.org/swift-6.0.3-release/ubuntu2404/swift-6.0.3-RELEASE/swift-6.0.3-RELEASE-ubuntu24.04.tar.gz -o /tmp/swift.tar.gz
            sudo mkdir -p /usr/share/swift
            sudo tar -xzf /tmp/swift.tar.gz -C /usr/share/swift --strip-components=1
            echo "/usr/share/swift/usr/bin" >> "$GITHUB_PATH"
            swift --version
          fi

      # scala 2.13: not preinstalled on ubuntu runners (kotlinc is);
      # SDKMAN is the canonical installer - matches build.str's 2.13.14
      - name: Install Scala 2.13 (SDKMAN)
        if: runner.os == 'Linux'
        run: |
          curl -s https://get.sdkman.io | bash
          source ~/.sdkman/bin/sdkman-init.sh
          sdk install scala 2.13.14
          scalac -version
          echo ~/.sdkman/candidates/scala/current/bin >> "$GITHUB_PATH"

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          # Earlier apt burnouts were real (azure mirror unreachable), but
          # the first probe here fed "host/path" strings to `getent hosts`,
          # which can never resolve - the "selectively dead DNS" theory was
          # an artifact of that bug (bare hostnames like github.com resolved
          # fine all along). Probe HOSTNAMES ONLY, map to paths separately.
          set -x
          pick=""
          for h in mirrors.edge.kernel.org mirror.rackspace.com azure.archive.ubuntu.com; do
            if timeout 10 getent hosts "$h" >/dev/null 2>&1; then pick="$h"; break; fi
          done
          if [ -z "$pick" ]; then
            echo "no candidate mirror resolves - dumping diagnostics"
            resolvectl status || true
            exit 1
          fi
          case "$pick" in
            mirrors.edge.kernel.org) uri="http://mirrors.edge.kernel.org/ubuntu" ;;
            mirror.rackspace.com)   uri="http://mirror.rackspace.com/ubuntu" ;;
            *)                      uri="http://azure.archive.ubuntu.com/ubuntu" ;;
          esac
          echo "chosen mirror: $uri"
          sudo sed -i "s|URIs: .*|URIs: $uri|" /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::ForceIPv4=true update
          sudo apt-get -o Acquire::ForceIPv4=true install -y php-cli lua5.4 luarocks elixir cmake \
            libwebsockets-dev libcurl4-openssl-dev libjson-c-dev \
            libwebsocketpp-dev libasio-dev libboost-dev
          # apt-get update exits 0 even when every Ubuntu index failed and
          # stale caches were silently reused (observed: "Temporary failure
          # resolving" x4, then "primary mirror OK"). Verify the installable
          # set instead of trusting the exit code.
          for p in php-cli elixir luarocks libwebsockets-dev; do
            apt-cache policy "$p" | grep -q 'Candidate:' || { echo "::error::index for $p is missing - mirror did not actually work"; exit 1; }
          done

      # kotlin/scala/clojure: no runtime download here - runner egress to
      # GitHub-release/SDKMAN CDNs is currently 504ing; pack targets emit
      # source tarballs when the toolchain is absent (see Makefile).

      - name: Install macOS extras
        if: runner.os == 'macOS'
        run: brew install kotlin scala clojure libwebsockets json-c
      - name: Verify core
        run: go build ./... && go test -count=1 ./...
        env:
          ET_PG_TEST_DSN: postgres://etunnel:etunnel-ci@localhost:5432/etunnel?sslmode=disable
          ET_REDIS_TEST_URL: redis://localhost:6379/15
      - name: Live cluster-store tests must PASS (not skip)
        run: |
          out=$(go test -count=1 -v -run 'TestPgAccountStoreLive|TestRedisCounterLive|TestStickyRouterLive' ./server/ 2>&1)
          echo "$out" | grep -E '^--- (PASS|SKIP)'
          echo "$out" | grep -q '^--- SKIP' && { echo "FAIL: live tests skipped"; exit 1; } || true
        env:
          ET_PG_TEST_DSN: postgres://etunnel:etunnel-ci@localhost:5432/etunnel?sslmode=disable
          ET_REDIS_TEST_URL: redis://localhost:6379/15

      - name: Version gate (tag must match every manifest)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAGV="${GITHUB_REF_NAME#v}"
          echo "tag version: $TAGV"
          python3 scripts/bump-release.py --check "$TAGV"

      - name: Pack all SDKs
        run: make pack-all

      - name: Pack Linux extras (lua rock / elixir hex)
        if: runner.os == 'Linux'
        run: |
          set -e
          cd sdks/lua && luarocks pack ggcode.etunnel-*-1.rockspec && mv *.rock ../../dist/packages/ && cd ../..
          cd sdks/elixir && mix local.hex --force && mix local.rebar --force && mix deps.get --only prod && MIX_ENV=prod mix compile

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-packages-${{ matrix.os }}
          path: dist/packages/

  # ------------------------------------------------------------------
  # Publishing. The npm job below uses OIDC *trusted publishing* - no
  # NPM_TOKEN secret. One-time setup on npmjs.com (user said they will do
  # this): Org easytunnel -> Packages -> Connect npm package @easytunnel/et-sdk
  # -> Trusted Publisher: repository topcheer/etunnel, workflow filename
  # sdk-packages.yml, environment "npm" (create that GH environment first).
  # ------------------------------------------------------------------
  # Swift SDK is Apple-platforms-only (#90: URLSessionWebSocketTask never
  # existed in Linux swift-corelibs-foundation). The Linux pack job ships
  # the source tarball; THIS job is the compile gate. macos-13 pool
  # (macos-14 rejected configs in earlier attempts).
  swift-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift build (Apple platforms gate)
        working-directory: sdks/swift
        run: |
          swift build -c release
          echo "swift: compile verified on macOS"

  publish-npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for npm trusted publishing
      contents: read
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm (trusted publishing needs npm >= 11.5.0; node 22 ships npm 10.x)
        run: npm install -g npm@latest && npm --version
      - name: Publish @easytunnel/et-sdk (provenance via OIDC, idempotent)
        run: |
          cd sdks/node
          V=$(node -p "require('./package.json').version")
          if npm view @easytunnel/et-sdk@${V} version 2>/dev/null | grep -q "^${V}$"; then
            echo "npm: ${V} already published, skipping"
          else
            npm publish --access public
          fi

  publish-pypi:
    # PyPI trusted publishing (OIDC, no token). One-time setup on pypi.org:
    # manage.pypi.org -> Publishing -> Add a new *pending* publisher:
    #   name=etunnel  owner=topcheer  repo=etunnel  workflow=sdk-packages.yml  env=pypi
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for PyPI trusted publishing
      contents: read
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install build
      - run: cd sdks/python && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/
          skip-existing: true   # idempotent: version present -> skip, not fail

  publish-rubygems:
    # RubyGems trusted publishing via the official release-gem action
    # (configure-credentials + bundle exec rake release inside).
    # Trusted publisher on the gem page: topcheer/etunnel + sdk-packages.yml
    # + environment rubygems.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mandatory for trusted publishing
      contents: write # required for `rake release` to push the release tag
    environment: rubygems
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Idempotence gate (skip when version already on rubygems)
        id: gate
        run: |
          V=$(ruby -e "print Gem::Specification.load('sdks/ruby/etunnel.gemspec').version")
          if curl -sf "https://rubygems.org/api/v1/gems/etunnel/versions/${V}.json" > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Ruby
        if: steps.gate.outputs.published != 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: sdks/ruby
      - name: Release gem (official action)
        if: steps.gate.outputs.published != 'true'
        uses: rubygems/release-gem@v1
        with:
          working-directory: sdks/ruby
      - name: Verify version landed on rubygems
        if: steps.gate.outputs.published != 'true'
        run: |
          V=$(ruby -e "print Gem::Specification.load('sdks/ruby/etunnel.gemspec').version")
          for i in $(seq 1 20); do
            L=$(curl -sf "https://rubygems.org/api/v1/gems/etunnel.json" | ruby -e "require 'json';print JSON.parse(STDIN.read)['version'] rescue ''")
            if [ "$L" = "$V" ]; then
              echo "rubygems: ${V} live"; exit 0
            fi
            sleep 15
          done
          echo "rubygems: ${V} NOT visible after 5min"; exit 1

  publish-nuget:
    # NuGet trusted publishing (OIDC, no API key) - configured Active on
    # nuget.org with glob * (first push allowed via OIDC). dotnet >= 9.0.2xx
    # auto-detects Actions OIDC on push without an API key.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: nuget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: cd sdks/csharp && dotnet pack -c Release -o ../../dist/packages
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: nugetlogin
        with:
          user: zhanju
      - name: push to NuGet (check-then-push, idempotent)
        run: |
          V=$(grep -m1 -o '<Version>[^<]*</Version>' sdks/csharp/Etunnel.csproj | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/')
          if curl -sf "https://api.nuget.org/v3-flatcontainer/etunnel/${V}/etunnel.nuspec" > /dev/null; then
            echo "nuget: ${V} already published, skipping"
          else
            for pkg in dist/packages/*.nupkg; do
              dotnet nuget push "$pkg" \
                --api-key "${{ steps.nugetlogin.outputs.NUGET_API_KEY }}" \
                --source https://api.nuget.org/v3/index.json --skip-duplicate
            done
          fi

  publish-hex:
    # Hex Workload Identity (trusted publishing). Bootstrap: first release is
    # pushed manually (workload identities can't create a package), then the
    # owner adds a Workload Identity on hex.pm/gems/etunnel -> Workload
    # identities: repo owner topcheer, repo etunnel, workflow sdk-packages.yml,
    # env hex. Fail-soft until that is done.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: hex
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
      - name: mix hex.publish (idempotent, OIDC workload identity)
        run: |
          cd sdks/elixir
          V=$(grep -oP '(?<=version: ")[^"]+' mix.exs | head -1)
          if curl -sf "https://hex.pm/api/packages/etunnel/releases/$V" > /dev/null; then
            echo "hex: ${V} already published, skipping"
          else
            mix deps.get
            mix hex.publish --yes   # OIDC auto: id-token:write + no HEX_API_KEY
          fi

  publish-dart:
    # pub.dev automated publishing (OIDC): topcheer/etunnel + sdk-packages.yml
    # configured on the package's Automated publishing settings.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: pub
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: dart pub publish (idempotent)
        run: |
          V=$(sed -n 's/^version: //p' sdks/dart/pubspec.yaml | head -1)
          if curl -sf "https://pub.dev/api/packages/etunnel" | grep -q "\"$V\""; then
            echo "pub.dev: ${V} already published, skipping"
          else
            cd sdks/dart && dart pub publish --force
          fi

  publish-jsr:
    # JSR (@ggcode/etunnel): scope linked to GitHub on jsr.io; deno publish
    # uses OIDC automatically with id-token:write.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: 'v2.x' }
      - name: deno publish (idempotent)
        run: |
          V=$(deno eval "const c=JSON.parse(await Deno.readTextFile('sdks/deno/deno.json'));console.log(c.version)")
          if curl -sf "https://jsr.io/@ggcode/etunnel/meta.json" | grep -q "\"$V\""; then
            echo "jsr: ${V} already published, skipping"
          else
            cd sdks/deno && deno publish --allow-dirty --no-check
          fi

  publish-central:
    # Maven Central (dev.ggcode namespace, verified via NS on the Portal).
    # Secrets: MAVEN_USERNAME/MAVEN_PASSWORD (Portal token), GPG_PRIVATE_KEY,
    # GPG_PASSPHRASE. Signs with sources+javadoc via the central profile.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
      - name: Write Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<XML
          <settings><servers>
          <server>
            <id>central</id>
            <username>${{ secrets.MAVEN_USERNAME }}</username>
            <password>${{ secrets.MAVEN_PASSWORD }}</password>
          </server>
          </servers></settings>
          XML
      - name: Publish to Maven Central (idempotent)
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          V=$(grep -m1 '<version>' sdks/java/pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          if curl -sf "https://repo1.maven.org/maven2/dev/ggcode/etunnel/${V}/etunnel-${V}.pom" > /dev/null; then
            echo "central: ${V} already published, skipping"
          else
            mvn -B -Pcentral -f sdks/java/pom.xml deploy
          fi

  publish-crates:
    # crates.io: long-lived account token in CARGO_REGISTRY_TOKEN (no OIDC
    # support upstream). Idempotent via registry version check.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish (idempotent)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          V=$(grep -m1 '^version' sdks/rust/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/etunnel/$V")
          if [ "$code" = "200" ]; then echo "crates: $V already published"; else
            cd sdks/rust && cargo publish --allow-dirty --token "$CARGO_REGISTRY_TOKEN"
          fi

  publish-luarocks:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
      - name: install luarocks
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq luarocks lua-cjson
      - name: luarocks upload (idempotent)
        env:
          LR_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: |
          V=$(grep -m1 '^version' sdks/lua/ggcode.etunnel-*-1.rockspec | sed 's/version = "\(.*\)-1"/\1/')
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://luarocks.org/modules/topcheer/ggcode.etunnel/${V}-1")
          if [ "$code" = "200" ]; then echo "luarocks: $V already published"; else
            cd sdks/lua && luarocks upload ggcode.etunnel-${V}-1.rockspec --api-key="$LR_KEY"
          fi

  publish-clojars:
    # Clojure SDK keeps its own GAV (dev.ggcode:etunnel-clj) - it is a
    # separate source (etunnel.clj), distinct from the Java artifact on
    # Maven Central (Clojars forbids shadowing Central GAVs).
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Write clojars settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<XML
          <settings><servers><server>
            <id>clojars</id>
            <username>${{ secrets.CLOJARS_USERNAME }}</username>
            <password>${{ secrets.CLOJARS_TOKEN }}</password>
          </server></servers></settings>
          XML
      - name: Deploy etunnel-clj (idempotent)
        run: |
          V=$(grep -m1 '<version>' sdks/clojure/pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://repo.clojars.org/dev/ggcode/etunnel-clj/${V}/")
          if [ "$code" = "200" ]; then echo "clojars: $V already published"; else
            cd sdks/clojure && jar cf /tmp/etunnel-clj.jar etunnel.clj && \
            mvn -q deploy:deploy-file -DrepositoryId=clojars -Durl=https://repo.clojars.org \
              -Dfile=/tmp/etunnel-clj.jar -DpomFile=pom.xml
          fi
  #
  # publish-others:
  #   # crates.io / RubyGems / NuGet / Hex / LuaRocks / Clojars / Maven Central:
  #   # see PACKAGING.md for the exact per-registry commands and secrets.
  #   needs: build
  #   if: startsWith(github.ref, 'refs/tags/v')
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: echo "follow PACKAGING.md publish matrix"
