name: sdk-packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@v4

      # ---- language setup actions (both OS) ----
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with: { deno-version: 'v2.x' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: swift-actions/setup-swift@v2
        if: runner.os == 'Linux'
        with: { swift-version: '5.9' }

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli lua5.4 luarocks elixir cmake unzip \
            libwebsockets-dev libcurl4-openssl-dev libjson-c-dev \
            libwebsocketpp-dev libasio-dev

      - name: Install JVM extras - Linux (kotlin/scala/clojure)
        if: runner.os == 'Linux'
        run: |
          set -e
          curl -fsSL https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          sudo ln -sf /tmp/kotlin/kotlinc/bin/kotlinc /usr/local/bin/kotlinc
          curl -fsSL https://github.com/coursier/coursier/releases/latest/download/cs-x86_64-pc-linux.gz | gzip -d > /tmp/cs
          chmod +x /tmp/cs
          sudo /tmp/cs install scala:3.5.2 scalac:3.5.2 --install-dir /usr/local/bin
          curl -fsSL https://download.clojure.org/install/linux-install-1.12.0.1479.sh | sudo bash

      - name: Install macOS extras
        if: runner.os == 'macOS'
        run: brew install kotlin scala clojure libwebsockets json-c

      - name: Verify core
        run: go build ./... && go test -count=1 ./...

      - name: Pack all SDKs
        run: make pack-all

      - name: Pack Linux extras (lua rock / elixir hex)
        if: runner.os == 'Linux'
        run: |
          set -e
          cd sdks/lua && luarocks pack etunnel-1.0.0-1.rockspec && mv *.rock ../../dist/packages/ && cd ../..
          cd sdks/elixir && mix local.hex --force && mix deps.get && mix compile
          cd sdks/elixir && mix hex.build --output ../../dist/packages/etunnel-elixir-1.0.0.tar || true

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-packages-${{ matrix.os }}
          path: dist/packages/

  # ------------------------------------------------------------------
  # Publishing. The npm job below uses OIDC *trusted publishing* - no
  # NPM_TOKEN secret. One-time setup on npmjs.com (user said they will do
  # this): Org easytunnel -> Packages -> Connect npm package @easytunnel/et-sdk
  # -> Trusted Publisher: repository topcheer/etunnel, workflow filename
  # sdk-packages.yml, environment "npm" (create that GH environment first).
  # ------------------------------------------------------------------
  publish-npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for npm trusted publishing
      contents: read
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish @easytunnel/et-sdk (provenance via OIDC)
        run: cd sdks/node && npm publish --access public
  #
  # publish-others:
  #   # crates.io / RubyGems / NuGet / Hex / LuaRocks / Clojars / Maven Central:
  #   # see PACKAGING.md for the exact per-registry commands and secrets.
  #   needs: build
  #   if: startsWith(github.ref, 'refs/tags/v')
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: echo "follow PACKAGING.md publish matrix"
