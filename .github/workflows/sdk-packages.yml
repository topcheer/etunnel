name: sdk-packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 pool currently rejects configs ("not supported"); artifacts
        # are source-identical - ubuntu-only until the pool recovers
        os: [ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      # ---- language setup actions (both OS) ----
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # NOTE: deno is intentionally NOT installed - pack-deno only tars
      # sources (no deno invocation), and setup-deno was the sole recurring
      # 504 source (deno CDN flakes).
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: swift-actions/setup-swift@v2
        if: runner.os == 'Linux'
        with: { swift-version: '5.9' }

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli lua5.4 luarocks elixir cmake \
            libwebsockets-dev libcurl4-openssl-dev libjson-c-dev \
            libwebsocketpp-dev libasio-dev

      # kotlin/scala/clojure: no runtime download here - runner egress to
      # GitHub-release/SDKMAN CDNs is currently 504ing; pack targets emit
      # source tarballs when the toolchain is absent (see Makefile).

      - name: Install macOS extras
        if: runner.os == 'macOS'
        run: brew install kotlin scala clojure libwebsockets json-c
      - name: Verify core
        run: go build ./... && go test -count=1 ./...

      - name: Pack all SDKs
        run: make pack-all

      - name: Pack Linux extras (lua rock / elixir hex)
        if: runner.os == 'Linux'
        run: |
          set -e
          cd sdks/lua && luarocks pack etunnel-1.0.0-1.rockspec && mv *.rock ../../dist/packages/ && cd ../..
          cd sdks/elixir && mix local.hex --force && mix deps.get && mix compile
          cd sdks/elixir && mix hex.build --output ../../dist/packages/etunnel-elixir-1.0.0.tar || true

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-packages-${{ matrix.os }}
          path: dist/packages/

  # ------------------------------------------------------------------
  # Publishing. The npm job below uses OIDC *trusted publishing* - no
  # NPM_TOKEN secret. One-time setup on npmjs.com (user said they will do
  # this): Org easytunnel -> Packages -> Connect npm package @easytunnel/et-sdk
  # -> Trusted Publisher: repository topcheer/etunnel, workflow filename
  # sdk-packages.yml, environment "npm" (create that GH environment first).
  # ------------------------------------------------------------------
  publish-npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for npm trusted publishing
      contents: read
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm (trusted publishing needs npm >= 11.5.0; node 22 ships npm 10.x)
        run: npm install -g npm@latest && npm --version
      - name: Publish @easytunnel/et-sdk (provenance via OIDC, idempotent)
        run: |
          cd sdks/node
          V=$(node -p "require('./package.json').version")
          if npm view @easytunnel/et-sdk@${V} version 2>/dev/null | grep -q "^${V}$"; then
            echo "npm: ${V} already published, skipping"
          else
            npm publish --access public
          fi

  publish-pypi:
    # PyPI trusted publishing (OIDC, no token). One-time setup on pypi.org:
    # manage.pypi.org -> Publishing -> Add a new *pending* publisher:
    #   name=etunnel  owner=topcheer  repo=etunnel  workflow=sdk-packages.yml  env=pypi
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for PyPI trusted publishing
      contents: read
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install build
      - run: cd sdks/python && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/
          skip-existing: true   # idempotent: version present -> skip, not fail

  publish-rubygems:
    # RubyGems trusted publishing (OIDC). One-time bootstrap, same shape as npm:
    # 1) manual first push: gem push dist/packages/etunnel-1.0.0.gem (needs API key
    #    from rubygems.org settings + OTP)
    # 2) then on the gem page -> Settings -> Trusted Publishing, add:
    #    owner=topcheer repo=etunnel workflow=sdk-packages.yml env=rubygems
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: rubygems
    # owner-binding input is not yet published in rubygems/* actions
    # (all releases lack `owner`); first push done manually, this job
    # stays fail-soft until an action release supports owner.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      # Manual OIDC exchange: rubygems/configure-rubygems-credentials has no
      # `owner` input in any release, but the exchange endpoint accepts it in
      # the JSON body (required while the pending trusted publisher exists).
      - name: OIDC exchange (owner-bound) + gem build
        run: |
          set -e
          OIDC=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rubygems.org" | jq -r .value)
          KEY=$(curl -fsS -X POST https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token \
            -H 'content-type: application/json' \
            -d "{\"jwt\":\"$OIDC\"}" \
            | tee /tmp/exch.json | jq -r '.rubygems_api_key // .rubygemsApiKey // empty')
          if [ -z "$KEY" ]; then cat /tmp/exch.json; echo; echo "exchange failed"; exit 1; fi
          echo "exchange ok, key owner: $(jq -r '.owner // "?"' /tmp/exch.json), id: $(jq -r '.id // "?"' /tmp/exch.json), scopes: $(jq -c '.scopes // "?"' /tmp/exch.json)"
          echo "::add-mask::$KEY"
          echo "GEM_HOST_API_KEY=$KEY" >> "$GITHUB_ENV"
          cd sdks/ruby && gem build etunnel.gemspec
      - name: gem push (idempotent)
        run: |
          V=$(ruby -e "print Gem::Specification.load('sdks/ruby/etunnel.gemspec').version")
          if curl -sf "https://rubygems.org/api/v1/gems/etunnel/versions/${V}.json" > /dev/null; then
            echo "rubygems: ${V} already published, skipping"
          else
            gem push sdks/ruby/etunnel-*.gem
          fi

  publish-nuget:
    # NuGet trusted publishing (OIDC, no API key) - configured Active on
    # nuget.org with glob * (first push allowed via OIDC). dotnet >= 9.0.2xx
    # auto-detects Actions OIDC on push without an API key.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: nuget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: cd sdks/csharp && dotnet pack -c Release -o ../../dist/packages
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: nugetlogin
        with:
          user: zhanju
      - name: push to NuGet (idempotent)
        run: |
          for pkg in dist/packages/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.nugetlogin.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

  publish-hex:
    # Hex Workload Identity (trusted publishing). Bootstrap: first release is
    # pushed manually (workload identities can't create a package), then the
    # owner adds a Workload Identity on hex.pm/gems/etunnel -> Workload
    # identities: repo owner topcheer, repo etunnel, workflow sdk-packages.yml,
    # env hex. Fail-soft until that is done.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: hex
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
      - name: mix hex.publish (idempotent, OIDC workload identity)
        run: |
          cd sdks/elixir
          V=$(grep -oP '(?<=version: ")[^"]+' mix.exs | head -1)
          if curl -sf "https://hex.pm/api/packages/etunnel/releases/$V" > /dev/null; then
            echo "hex: ${V} already published, skipping"
          else
            mix deps.get
            mix hex.publish --yes   # OIDC auto: id-token:write + no HEX_API_KEY
          fi

  publish-dart:
    # pub.dev automated publishing (OIDC): topcheer/etunnel + sdk-packages.yml
    # configured on the package's Automated publishing settings.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: pub
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: dart pub publish (idempotent)
        run: |
          V=$(sed -n 's/^version: //p' sdks/dart/pubspec.yaml | head -1)
          if curl -sf "https://pub.dev/api/packages/etunnel" | grep -q "\"$V\""; then
            echo "pub.dev: ${V} already published, skipping"
          else
            cd sdks/dart && dart pub publish --force
          fi

  publish-jsr:
    # JSR (@ggcode/etunnel): scope linked to GitHub on jsr.io; deno publish
    # uses OIDC automatically with id-token:write.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: 'v2.x' }
      - name: deno publish (idempotent)
        run: |
          V=$(deno eval "const c=JSON.parse(await Deno.readTextFile('sdks/deno/deno.json'));console.log(c.version)")
          if curl -sf "https://jsr.io/@ggcode/etunnel/meta.json" | grep -q "\"$V\""; then
            echo "jsr: ${V} already published, skipping"
          else
            cd sdks/deno && deno publish --allow-dirty --no-check
          fi

  publish-central:
    # Maven Central (dev.ggcode namespace, verified via NS on the Portal).
    # Secrets: MAVEN_USERNAME/MAVEN_PASSWORD (Portal token), GPG_PRIVATE_KEY,
    # GPG_PASSPHRASE. Signs with sources+javadoc via the central profile.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
      - name: Publish to Maven Central (idempotent)
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          V=$(grep -m1 '<version>' sdks/java/pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          if curl -sf "https://repo1.maven.org/maven2/dev/ggcode/etunnel/${V}/etunnel-${V}.pom" > /dev/null; then
            echo "central: ${V} already published, skipping"
          else
            mvn -B -Pcentral -f sdks/java/pom.xml deploy
          fi
  #
  # publish-others:
  #   # crates.io / RubyGems / NuGet / Hex / LuaRocks / Clojars / Maven Central:
  #   # see PACKAGING.md for the exact per-registry commands and secrets.
  #   needs: build
  #   if: startsWith(github.ref, 'refs/tags/v')
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: echo "follow PACKAGING.md publish matrix"
