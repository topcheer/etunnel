name: sdk-packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y golang php-cli lua5.4 luarocks elixir cmake \
            libwebsockets-dev libcurl4-openssl-dev libjson-c-dev \
            libwebsocketpp-dev libasio-dev
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash - && sudo apt-get install -y nodejs
          curl -fsSL https://deno.land/install.sh | sh -s -- -y && echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          curl -fsSL https://rustup.rs | sh -s -- -y --default-toolchain stable && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install toolchains (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install deno kotlin scala clojure libwebsockets json-c

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: swift-actions/setup-swift@v2
        if: runner.os == 'Linux'
        with: { swift-version: '5.9' }
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Verify core
        run: go build ./... && go test -count=1 ./...

      - name: Pack all SDKs
        run: make pack-all

      - name: Pack language-specific (Linux extras)
        if: runner.os == 'Linux'
        run: |
          set -e
          cd sdks/lua && luarocks pack etunnel-1.0.0-1.rockspec && mv *.rock ../../dist/packages/ && cd ../..
          cd sdks/elixir && mix local.hex --force && mix deps.get && mix compile
          cd sdks/elixir && mix hex.build --output ../../dist/packages/etunnel-elixir-1.0.0.tar || true

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-packages-${{ matrix.os }}
          path: dist/packages/

  # ------------------------------------------------------------------
  # Publishing. The npm job below uses OIDC *trusted publishing* - no
  # NPM_TOKEN secret. One-time setup on npmjs.com (user said they will do
  # this): Org easytunnel -> Packages -> Connect npm package @easytunnel/et-sdk
  # -> Trusted Publisher: repository topcheer/etunnel, workflow filename
  # sdk-packages.yml, environment "npm" (create that GH environment first).
  # ------------------------------------------------------------------
  publish-npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for npm trusted publishing
      contents: read
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish @easytunnel/et-sdk (provenance via OIDC)
        run: cd sdks/node && npm publish --access public
  #
  # publish-others:
